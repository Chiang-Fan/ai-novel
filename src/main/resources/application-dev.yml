# 开发环境配置
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ai_novel_writer?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:root123}
  
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 开发环境日志
logging:
  level:
    root: INFO
    com.ai.novel: DEBUG
    org.springframework.web: DEBUG
    org.springframework.ai: DEBUG

# AI API配置(开发环境)
spring.ai:
  openai:
    api-key: ${AI_API_KEY:your-dashscope-api-key}

# 服务器配置
server:
  port: 8080

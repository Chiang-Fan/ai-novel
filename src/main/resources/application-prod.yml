# 生产环境配置
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ai_novel_writer}?useUnicode=true&characterEncoding=UTF-8&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:ainovel}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
  
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

# 生产环境日志
logging:
  level:
    root: WARN
    com.ai.novel: INFO
    org.springframework.web: WARN
    org.springframework.ai: INFO

# AI API配置(生产环境)
spring.ai:
  openai:
    api-key: ${AI_API_KEY}

# 服务器配置
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true

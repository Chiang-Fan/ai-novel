spring:
  application:
    name: ai-novel-writer
  
  profiles:
    active: dev
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false
  
  # 数据源配置(在profile中具体配置)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # Flyway配置
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true
  
  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
  
  # 静态资源配置
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        cachecontrol:
          max-age: 3600
  
  mvc:
    static-path-pattern: /**

# Spring AI配置
spring.ai:
  openai:
    # API配置(通义千问使用OpenAI兼容模式)
    base-url: ${AI_API_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${AI_API_KEY:your-api-key-here}
    
    # 聊天模型配置
    chat:
      options:
        model: ${AI_MODEL:qwen-plus}
        temperature: 0.7
        max-tokens: 4000

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
  error:
    include-message: always
    include-binding-errors: always

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true

# 日志配置
logging:
  level:
    root: INFO
    com.ai.novel: DEBUG
    org.springframework.web: INFO
    org.springframework.ai: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/ai-novel-writer.log
    max-size: 10MB
    max-history: 30

# 应用自定义配置
app:
  # AI续写配置
  ai:
    default-temperature: 0.8
    default-max-tokens: 6000
    max-context-chapters: 5
    enable-content-analysis: true
  
  # 安全配置
  security:
    cors:
      allowed-origins: 
        - http://localhost:3000
        - http://localhost:8080
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600

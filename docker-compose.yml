###############################################################################
# AI Novel Writer - Docker Compose 配置
# 包含: MySQL 8.0 + Spring Boot应用
###############################################################################

version: '3.8'

services:
  # ==========================================================================
  # MySQL 数据库服务
  # ==========================================================================
  mysql:
    image: mysql:8.0
    container_name: ai-novel-mysql
    restart: always
    
    # 环境变量配置
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_novel_writer}
      MYSQL_USER: ${MYSQL_USER:-novel_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-novel_pass_123}
      TZ: Asia/Shanghai
    
    # 端口映射（宿主机:容器）
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    
    # 数据持久化 - 关键配置！
    volumes:
      # MySQL数据目录持久化
      - mysql_data:/var/lib/mysql
      # MySQL配置文件
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      # 初始化SQL脚本（可选）
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    
    # MySQL命令行参数
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=500
      - --innodb_buffer_pool_size=512M
    
    # 健康检查
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password_123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    # 网络配置
    networks:
      - ai-novel-network

  # ==========================================================================
  # Spring Boot 应用服务
  # ==========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-novel-writer:latest
    container_name: ai-novel-app
    restart: always
    
    # 依赖关系 - 等待MySQL就绪后再启动
    depends_on:
      mysql:
        condition: service_healthy
    
    # 环境变量配置
    environment:
      # Spring配置
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      
      # 数据库连接配置
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ai_novel_writer}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-novel_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-novel_pass_123}
      
      # AI服务配置
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      SPRING_AI_OPENAI_API_KEY: ${DASHSCOPE_API_KEY}
      SPRING_AI_OPENAI_BASE_URL: ${AI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      
      # JVM配置
      JAVA_OPTS: "-Xms512m -Xmx1024m"
      
      # 时区配置
      TZ: Asia/Shanghai
    
    # 端口映射
    ports:
      - "${APP_PORT:-8080}:8080"
    
    # 数据持久化
    volumes:
      # 应用日志持久化
      - app_logs:/app/logs
      # 应用数据目录（如果需要）
      - app_data:/app/data
    
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # 网络配置
    networks:
      - ai-novel-network

# ==============================================================================
# 数据卷定义 - 持久化存储
# ==============================================================================
volumes:
  # MySQL数据卷 - 确保数据库数据不会丢失
  mysql_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MYSQL_DATA_PATH:-./docker/data/mysql}
  
  # 应用日志卷
  app_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${APP_LOGS_PATH:-./docker/logs}
  
  # 应用数据卷
  app_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${APP_DATA_PATH:-./docker/data/app}

# ==============================================================================
# 网络定义
# ==============================================================================
networks:
  ai-novel-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

# 生产环境外部配置文件
# 将此文件放在 JAR 包同级目录，Spring Boot 会自动加载

spring:
  # 数据源配置 - MySQL
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_novel_writer?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: your_mysql_password_here
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA配置
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  # Spring AI配置 - 通义千问
  ai:
    openai:
      api-key: sk-your-qwen-api-key-here
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1

# AI服务配置
ai:
  qianwen:
    api-key: sk-your-qwen-api-key-here
    model: qwen-plus
    temperature: 0.7
    max-tokens: 4000
    timeout: 120000

# 服务器配置
server:
  port: 8080

# 日志配置
logging:
  level:
    root: INFO
    com.aiwriter: INFO
    org.springframework.web: WARN
  file:
    name: logs/application.log
    max-size: 100MB
    max-history: 30

# ==================== 配置说明 ====================
# 
# 必填项：
# 1. spring.datasource.url - MySQL连接地址
# 2. spring.datasource.username - 数据库用户名
# 3. spring.datasource.password - 数据库密码
# 4. spring.ai.openai.api-key - 通义千问API密钥
# 5. ai.qianwen.api-key - 通义千问API密钥
#
# 可选项：
# - server.port: 服务端口（默认8080）
# - spring.jpa.hibernate.ddl-auto: 表结构管理策略
#   * update: 自动更新表结构（首次部署推荐）
#   * validate: 只验证不修改（稳定运行推荐）
#   * none: 不处理表结构
